name: Expand verified project archive

on:
  push:
    branches:
      - feat/initial-techdebt-scanner-platform

permissions:
  contents: write

jobs:
  expand:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tail 00
        run: echo "8b2e179743ae7ded2476b2a3f0c009f75ec4d2fd6b9c4f9cbb64adfa88a8491a  .bootstrap/tail_00" | sha256sum -c -
      - name: Verify tail 01
        run: echo "1818974d7d112c94950a848dc56f003004c11427697b09019317484dd5f84676  .bootstrap/tail_01" | sha256sum -c -
      - name: Verify tail 02
        run: echo "c0909a24a160863bdb97cfbb4defc38cc82bac9cc16d45d045546965abbb1298  .bootstrap/tail_02" | sha256sum -c -
      - name: Verify tail 03
        run: echo "fca4aa535ba18cd4642c02403e07598e8c4420af405d443bc3707b0786212267  .bootstrap/tail_03" | sha256sum -c -
      - name: Verify tail 04
        run: echo "31901aba456e44299b6f4a8c3dff10f2fd8a7acfd8cd6e37dd34a7dc49cb32e0  .bootstrap/tail_04" | sha256sum -c -
      - name: Verify tail 05
        run: echo "604a4c82ec464e5476de319a0eeead52648259f3a23df589e5fc324c705d3235  .bootstrap/tail_05" | sha256sum -c -
      - name: Verify tail 06
        run: echo "6022bbcf3da680eaaf8433f354318a8f594d7d6475fb155f21aefbb236b1ec3f  .bootstrap/tail_06" | sha256sum -c -
      - name: Verify tail 07
        run: echo "d8a9feb898a3cc430198e7eefc9c94985036c3b709e3668264e02fcb12725786  .bootstrap/tail_07" | sha256sum -c -
      - name: Verify tail 08
        run: echo "6161d70f08b79dbcdd0ff01ab2d6625300d04c2432aad5387021ea12f0602182  .bootstrap/tail_08" | sha256sum -c -
      - name: Verify tail 09
        run: echo "eaf250eaaf164c1f3fcbd8f94e4d884886510637d44c0302ac1344765a83391a  .bootstrap/tail_09" | sha256sum -c -
      - name: Verify tail 10
        run: echo "bf71b02b87efae9b60fdc3288a0191bd43df59c0457d3caaf8265b6de047eaef  .bootstrap/tail_10" | sha256sum -c -
      - name: Verify tail 11
        run: echo "a1085ca7b1a8058bad8bd3c8bf53e6a387f79c791736da99e41596a6a5265a15  .bootstrap/tail_11" | sha256sum -c -
      - name: Verify tail 12
        run: echo "f2a3bd88678cdf6e3f4923a27e3a802a60473f1bedb8ac30d87b340ac6b4ee33  .bootstrap/tail_12" | sha256sum -c -
      - name: Verify tail 13
        run: echo "201483fbb6cdf5d01ca65ad1c0c41ecbe32ab5a66f05250f39359598222515d3  .bootstrap/tail_13" | sha256sum -c -

      - name: Rebuild and verify archive
        shell: bash
        run: |
          set -euo pipefail
          {
            for index in $(seq -w 0 12); do
              cat ".bootstrap/chunk_${index}"
            done
            cat .bootstrap/tail_*
          } | base64 --decode > /tmp/project.zip
          test "$(stat -c '%s' /tmp/project.zip)" = "102459"
          echo "a65bad5be291f95b18cce89b7720c1a340c315856c9e77db9f137162a92cf44f  /tmp/project.zip" | sha256sum -c -
          unzip -t /tmp/project.zip

      - name: Expand project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/project
          mkdir -p /tmp/project
          unzip -q /tmp/project.zip -d /tmp/project
          cp -a /tmp/project/techdebt-scanner-platform/. .
          rm -rf .bootstrap .github/workflows/bootstrap-project.yml

      - name: Commit expanded project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add TechDebt Scanner platform MVP"
          git push origin HEAD
